[project]
name = "day1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sudhir Singh", email = "sudhirsingh.awm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
day1 = "day1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "week2/day1",
    "week2/day7",
